# --- Console / logging (VCP on USART3) ---
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- Stacks/heap (M7 needs more headroom) ---
CONFIG_ISR_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768

# --- Networking driver knobs (if you will use on-board Ethernet) ---
CONFIG_ETH_STM32_HAL=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y

# --- Optional stability knobs (nice during bring-up) ---
CONFIG_ASSERT=y
CONFIG_DEBUG_OPTIMIZATIONS=y

CONFIG_NVS=y
